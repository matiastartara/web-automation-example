name: markhobson/maven-chrome:jdk-17

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 11 9 12 0"  

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: mvn verify -PallTests
    
    - name: Persist workflow data as artifacts
      uses: actions/upload-artifact@v2
      with:
       name: github-actions-artifact
       path: target/failsafe-reports/emailable-report.html
      
 
